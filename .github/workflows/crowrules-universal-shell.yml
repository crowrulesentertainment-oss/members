name: CrowRules Universal Shell Sync
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shell-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Universal CrowRules Shell
        shell: python
        run: |
          from pathlib import Path
          import re
          SCRIPT='https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1'
          tag=f'<script src="{SCRIPT}" defer></script>'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if SCRIPT not in s and re.search(r'</head>',s,re.I):
                  p.write_text(re.sub(r'</head>',tag+'</head>',s,count=1,flags=re.I),encoding='utf-8')
      - name: Commit shell updates
        run: |
          git config user.name "CrowRules Universal Shell"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "V1 standardize Universal CrowRules Shell across all HTML pages"
          git push
